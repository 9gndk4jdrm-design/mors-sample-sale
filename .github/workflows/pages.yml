name: Deploy MORS catalog to GitHub Pages
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: github-pages, cancel-in-progress: true}
jobs: {deploy: {runs-on: ubuntu-latest, environment: {name: github-pages, url: '${{ steps.dep.outputs.page_url }}'}, steps: [{uses: actions/checkout@v4}, {name: 'Unpack site bundle', run: 'rm -rf _site && mkdir -p _site && unzip -q site.zip -d _site && ls _site'}, {uses: actions/configure-pages@v5}, {uses: actions/upload-pages-artifact@v3, with: {path: _site}}, {id: dep, uses: actions/deploy-pages@v4}]}}
